name: Guardiao remote tests
run-name: Guardiao · ${{ github.event.client_payload.project_id || inputs.project_id }} · ${{ github.event.client_payload.correlation_id || inputs.correlation_id || github.run_id }}

# Install this workflow in every repository monitored by Guardiao.
on:
  repository_dispatch:
    types: [run-guardiao-automation]
  workflow_dispatch:
    inputs:
      project_id:
        description: Guardiao project id
        required: true
        type: string
      correlation_id:
        description: Correlation id generated by Guardiao
        required: false
        type: string
      automation_type:
        description: Suite to execute
        required: true
        type: choice
        options: [build]

permissions:
  contents: read

jobs:
  run-project-tests:
    name: Run repository suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: ${{ github.event.client_payload.project_id || inputs.project_id }}
      CORRELATION_ID: ${{ github.event.client_payload.correlation_id || inputs.correlation_id || github.run_id }}
      AUTOMATION_TYPE: ${{ github.event.client_payload.automation_type || inputs.automation_type }}

    steps:
      - name: Validate dispatch payload
        run: |
          test -n "$PROJECT_ID" || { echo "project_id is required"; exit 1; }
          test -n "$CORRELATION_ID" || { echo "correlation_id is required"; exit 1; }
          case "$AUTOMATION_TYPE" in build) ;; *) echo "Unsupported automation_type for architect-s-showcase: $AUTOMATION_TYPE"; exit 1;; esac
          echo "START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout monitored repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          test -f package.json || { echo "This reusable workflow currently supports Node.js repositories with package.json."; exit 1; }
          test -f package-lock.json || { echo "package-lock.json is required for reproducible execution. Add it or provide a project-specific workflow."; exit 1; }
          npm ci --include=optional

      - name: Execute selected suite
        run: npm run build

      - name: Report result to Guardiao
        if: ${{ always() && secrets.GUARDIAO_API_URL != '' && secrets.GUARDIAO_CALLBACK_SECRET != '' }}
        env:
          GUARDIAO_API_URL: ${{ secrets.GUARDIAO_API_URL }}
          GUARDIAO_CALLBACK_SECRET: ${{ secrets.GUARDIAO_CALLBACK_SECRET }}
          JOB_STATUS: ${{ job.status }}
        run: |
          CONCLUSION="success"
          if [ "$JOB_STATUS" != "success" ]; then CONCLUSION="failure"; fi
          CALLBACK_TIMESTAMP=$(date +%s000)
          CALLBACK_PAYLOAD="$CALLBACK_TIMESTAMP.$PROJECT_ID.$CORRELATION_ID.$AUTOMATION_TYPE.$CONCLUSION"
          CALLBACK_SIGNATURE=$(printf '%s' "$CALLBACK_PAYLOAD" | openssl dgst -sha256 -hmac "$GUARDIAO_CALLBACK_SECRET" -hex | sed 's/^.* //')
          DURATION_SECONDS=$(( $(date +%s) - START_EPOCH ))
          curl --fail --silent --show-error -X POST "$GUARDIAO_API_URL/api/v1/automations/callback" \
            -H "Content-Type: application/json" \
            -H "x-guardiao-callback-secret: $GUARDIAO_CALLBACK_SECRET" \
            -H "x-guardiao-callback-timestamp: $CALLBACK_TIMESTAMP" \
            -H "x-guardiao-callback-signature: $CALLBACK_SIGNATURE" \
            -d "{\"projectId\":\"$PROJECT_ID\",\"correlationId\":\"$CORRELATION_ID\",\"automationType\":\"$AUTOMATION_TYPE\",\"conclusion\":\"$CONCLUSION\",\"message\":\"$AUTOMATION_TYPE finished\",\"githubRunUrl\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"branch\":\"$GITHUB_REF_NAME\",\"commitSha\":\"$GITHUB_SHA\",\"durationSeconds\":$DURATION_SECONDS}"
